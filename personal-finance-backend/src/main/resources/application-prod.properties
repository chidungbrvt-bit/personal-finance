# Flyway changes the schema; Hibernate only checks that entities still match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=INFO
logging.level.com.dung.personal_finance_backend=INFO

# Do not expose internal error details through Spring Boot's default error response.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

spring.application.name=personal-finance-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Runtime database settings must be supplied by the environment.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Avoid database queries during response serialization.
spring.jpa.open-in-view=false

# Flyway is the only runtime schema-change mechanism.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
# Set true only once when adopting Flyway for an existing non-empty schema.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing Hibernate schema

# Set JWT_SECRET in your environment. It must be a Base64-encoded key of at least 32 bytes.
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Comma-separated frontend origins. Do not add a trailing slash.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

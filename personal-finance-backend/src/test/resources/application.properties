spring.datasource.url=jdbc:h2:mem:personal_finance_test;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=MONTH,YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Unit and integration tests use Hibernate's isolated H2 schema.
spring.flyway.enabled=false

# Test-only key. The real application reads JWT_SECRET from the environment.
security.jwt.secret=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
security.jwt.expiration-ms=3600000

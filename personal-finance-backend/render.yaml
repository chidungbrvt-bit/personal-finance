# In Render's Blueprint form set Blueprint Path to:
# personal-finance-backend/render.yaml
services:
  - type: web
    name: personal-finance-api
    runtime: docker
    repo: https://github.com/chidungbrvt-bit/personal-finance
    branch: main
    plan: free
    region: singapore
    dockerfilePath: ./personal-finance-backend/Dockerfile
    dockerContext: ./personal-finance-backend
    healthCheckPath: /api/public/welcome
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: "10000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://personal-finance-blond-seven.vercel.app
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "3"
      - key: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE
        value: "0"
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
